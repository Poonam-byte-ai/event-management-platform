<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Event — Event Management Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="brand">Event Admin</div>
    <nav>
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="events.html">Manage Events</a>
      <a href="new-event.html" class="active" id="navLabel">Create Event</a>
      <a href="speakers.html">Speakers</a>
      <a href="sessions.html">Sessions</a>
      <a href="participants.html">Participants</a>
      <a href="attendance.html">Attendance / QR</a>
      <a href="feedback.html">Feedback</a>
    </nav>
    <div class="signout">
      Signed in as <strong id="adminName"></strong><br>
      <button onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="main">
    <h1 id="pageHeading">Create Event</h1>
    <p class="page-subtitle" id="pageSubtitle">Add a new event to the platform</p>

    <div id="msg" class="msg"></div>

    <div class="card">
      <div style="padding: 22px 24px;">
        <form id="eventForm">
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" required>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" rows="3"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="event_date">Date</label>
              <input type="date" id="event_date" required>
            </div>
            <div class="field">
              <label>Time</label>
              <div class="time-picker-row">
                <select id="event_time_hour" class="time-select"></select>
                <select id="event_time_minute" class="time-select"></select>
                <select id="event_time_ampm" class="time-select"></select>
              </div>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="venue">Venue</label>
              <input type="text" id="venue" required>
            </div>
            <div class="field">
              <label for="capacity">Capacity</label>
              <input type="number" id="capacity" min="1" required>
            </div>
          </div>
          <div class="field">
            <label for="tags">Tags (comma-separated, e.g. "AI, coding, workshop") — used to suggest this event to participants with matching interests</label>
            <input type="text" id="tags" placeholder="AI, coding, workshop">
          </div>
          <div class="field">
            <label for="event_type">Event type</label>
            <select id="event_type" required>
              <option value="optional">Optional</option>
              <option value="compulsory">Compulsory</option>
            </select>
          </div>
          <button type="submit" class="btn" id="submitBtn">Create event</button>
          <a href="events.html" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAdmin();
  document.getElementById('adminName').textContent = getUserName();

  const eventId = getQueryParam('id'); // present = edit mode
  const msg = document.getElementById('msg');
  const form = document.getElementById('eventForm');
  const submitBtn = document.getElementById('submitBtn');

  populateTimeSelects('event_time');

  if (eventId) {
    document.getElementById('pageHeading').textContent = 'Edit Event';
    document.getElementById('pageSubtitle').textContent = 'Update this event\'s details';
    document.getElementById('navLabel').textContent = 'Edit Event';
    submitBtn.textContent = 'Save changes';

    (async () => {
      try {
        const data = await apiRequest(`/events/${eventId}`);
        const e = data.event;
        document.getElementById('title').value = e.title;
        document.getElementById('description').value = e.description || '';
        document.getElementById('event_date').value = e.event_date.slice(0, 10);
        setTimeSelects('event_time', e.event_time);
        document.getElementById('venue').value = e.venue;
        document.getElementById('capacity').value = e.capacity;
        document.getElementById('tags').value = e.tags || '';
        document.getElementById('event_type').value = e.event_type;
      } catch (err) {
        showMessage(msg, err.message);
      }
    })();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showMessage(msg, '');
    submitBtn.disabled = true;

    const body = {
      title: document.getElementById('title').value.trim(),
      description: document.getElementById('description').value.trim(),
      event_date: document.getElementById('event_date').value,
      event_time: readTimeSelects('event_time'),
      venue: document.getElementById('venue').value.trim(),
      capacity: Number(document.getElementById('capacity').value),
      tags: document.getElementById('tags').value.trim(),
      event_type: document.getElementById('event_type').value,
    };

    try {
      if (eventId) {
        await apiRequest(`/events/${eventId}`, 'PUT', body);
      } else {
        await apiRequest('/events', 'POST', body);
      }
      window.location.href = 'events.html';
    } catch (err) {
      showMessage(msg, err.message);
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
