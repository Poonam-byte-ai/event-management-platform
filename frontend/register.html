<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — Event Management Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-shell">
  <div class="auth-card">

    <h1>Create your account</h1>

    <p class="subtitle">
      Register as a participant to join events.
    </p>

    <div id="msg" class="msg"></div>

    <form id="registerForm">

      <div class="field">
        <label for="name">Full name</label>
        <input
          type="text"
          id="name"
          required
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label for="prn">PRN / Student ID</label>
        <input
          type="text"
          id="prn"
          required
        >
      </div>

      <div class="field">
        <label for="interests">
          Interests (comma-separated, e.g. "AI, music, coding")
        </label>

        <input
          type="text"
          id="interests"
          placeholder="AI, coding, music"
        >
      </div>

      <div class="field">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          required
          autocomplete="username"
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          required
          autocomplete="new-password"
        >
      </div>

      <button
        type="submit"
        class="btn btn-block"
        id="submitBtn"
      >
        Create account
      </button>

    </form>

    <p
      class="subtitle"
      style="margin-top:18px; margin-bottom:0;"
    >
      Already have an account?
      <a href="login.html">Log in</a>
      ·
      <a href="index.html">Back to home</a>
    </p>

  </div>
</div>

<script src="js/api.js"></script>

<script>

  // If the user is already logged in,
  // redirect them to the appropriate dashboard.
  if (getToken()) {
    window.location.href =
      getRole() === 'admin'
        ? 'admin-dashboard.html'
        : 'participant-dashboard.html';
  }

  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {

    e.preventDefault();

    showMessage(msg, '');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    const name =
      document.getElementById('name').value.trim();

    const prn =
      document.getElementById('prn').value.trim();

    const email =
      document.getElementById('email').value.trim();

    const password =
      document.getElementById('password').value;

    const interests =
      document.getElementById('interests').value.trim();

    try {

      await apiRequest(
        '/auth/register',
        'POST',
        {
          name,
          prn,
          email,
          password,
          role: 'participant',
          interests
        }
      );

      showMessage(
        msg,
        'Account created successfully! Redirecting to login...',
        false
      );

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);

    } catch (err) {

      showMessage(msg, err.message);

      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }

  });

</script>

</body>
</html>
