<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — Event Management Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-shell">
  <div class="auth-card">

    <h1>Create your account</h1>

    <p class="subtitle">
      Register as a participant or organizer.
    </p>

    <div id="msg" class="msg"></div>

    <!-- Account type -->
    <div class="field">
      <label>Account Type</label>

      <div class="role-toggle">
        <button
          type="button"
          id="tabParticipant"
          class="btn active"
        >
          Participant
        </button>

        <button
          type="button"
          id="tabAdmin"
          class="btn"
        >
          Organizer (Admin)
        </button>
      </div>
    </div>

    <form id="registerForm">

      <div class="field">
        <label for="name">Full name</label>
        <input
          type="text"
          id="name"
          required
          autocomplete="name"
        >
      </div>

      <div class="field" id="prnField">
        <label for="prn">PRN / Student ID</label>
        <input
          type="text"
          id="prn"
        >
      </div>

      <div class="field" id="interestsField">
        <label for="interests">
          Interests (comma-separated, e.g. "AI, music, coding")
        </label>

        <input
          type="text"
          id="interests"
          placeholder="AI, coding, music"
        >
      </div>

      <div class="field">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          required
          autocomplete="username"
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          required
          autocomplete="new-password"
        >
      </div>

      <button
        type="submit"
        class="btn btn-block"
        id="submitBtn"
      >
        Create participant account
      </button>

    </form>

    <p
      class="subtitle"
      style="margin-top:18px; margin-bottom:0;"
    >
      Already have an account?
      <a href="login.html">Log in</a>
      ·
      <a href="index.html">Back to home</a>
    </p>

  </div>
</div>

<script src="js/api.js"></script>

<script>

  let selectedRole = 'participant';

  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  const tabParticipant =
    document.getElementById('tabParticipant');

  const tabAdmin =
    document.getElementById('tabAdmin');

  const prnField =
    document.getElementById('prnField');

  const interestsField =
    document.getElementById('interestsField');

  const prnInput =
    document.getElementById('prn');

  const interestsInput =
    document.getElementById('interests');


  function selectRole(role) {

    selectedRole = role;

    if (role === 'participant') {

      tabParticipant.classList.add('active');
      tabAdmin.classList.remove('active');

      prnField.style.display = 'block';
      interestsField.style.display = 'block';

      prnInput.required = true;

      submitBtn.textContent =
        'Create participant account';

    } else {

      tabAdmin.classList.add('active');
      tabParticipant.classList.remove('active');

      prnField.style.display = 'none';
      interestsField.style.display = 'none';

      prnInput.required = false;

      submitBtn.textContent =
        'Create organizer account';
    }

    showMessage(msg, '');
  }


  tabParticipant.addEventListener(
    'click',
    () => selectRole('participant')
  );


  tabAdmin.addEventListener(
    'click',
    () => selectRole('admin')
  );


  form.addEventListener('submit', async (e) => {

    e.preventDefault();

    showMessage(msg, '');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    const name =
      document.getElementById('name').value.trim();

    const email =
      document.getElementById('email').value.trim();

    const password =
      document.getElementById('password').value;

    const prn =
      prnInput.value.trim();

    const interests =
      interestsInput.value.trim();


    try {

      await apiRequest(
        '/auth/register',
        'POST',
        {
          name,
          email,
          password,
          prn: selectedRole === 'participant'
            ? prn
            : null,
          role: selectedRole,
          interests: selectedRole === 'participant'
            ? interests
            : null
        }
      );


      showMessage(
        msg,
        'Account created successfully! Redirecting to login...',
        false
      );


      setTimeout(() => {

        window.location.href =
          'login.html';

      }, 1200);


    } catch (err) {

      showMessage(
        msg,
        err.message
      );

      submitBtn.disabled = false;

      submitBtn.textContent =
        selectedRole === 'participant'
          ? 'Create participant account'
          : 'Create organizer account';
    }

  });

</script>

</body>
</html>
