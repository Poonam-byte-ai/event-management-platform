<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Event Management Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Event Management Platform</h1>
    <p class="subtitle">Log in to continue</p>

    <div id="msg" class="msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-block" id="submitBtn">Log in</button>
    </form>

    <p class="subtitle" style="margin-top:18px; margin-bottom:0;">
      New participant? <a href="register.html">Create an account</a> · <a href="index.html">Back to home</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // If the user arrived here via a QR check-in link, we're sent back there
  // (instead of the default dashboard) once they're logged in.
  const returnTo = getQueryParam('returnTo');

  // If already logged in, skip straight to the right place.
  if (getToken()) {
    window.location.href = returnTo ? decodeURIComponent(returnTo) : (getRole() === 'admin' ? 'admin-dashboard.html' : 'participant-dashboard.html');
  }

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showMessage(msg, '');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const data = await apiRequest('/auth/login', 'POST', { email, password });
      saveSession(data.token, data.user);
      window.location.href = returnTo ? decodeURIComponent(returnTo) : (data.user.role === 'admin' ? 'admin-dashboard.html' : 'participant-dashboard.html');
    } catch (err) {
      showMessage(msg, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>

</body>
</html>
